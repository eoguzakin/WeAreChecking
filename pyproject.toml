[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wearechecking"
version = "0.1.0"
description = "Reproducible F1 weekend forecasting — first draft under active development"
requires-python = ">=3.12,<3.15"

# Security floors for the SignalR/MessagePack dependencies brought in by FastF1.
dependencies = ["fastf1==3.9.1", "pandas>=2.2,<3", "pyarrow>=18,<24", "requests>=2.32,<3", "requests-cache>=1.2,<2", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "signalrcore>=1.0.4,<2", "msgpack>=1.2.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7.16,<8", "ipykernel>=6.29,<8"]

[project.scripts]
wac = "wearechecking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
